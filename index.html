<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Space — Walkable Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- HUD: Top Bar -->
    <div id="hud-top">
      <div id="logo"><span></span> <span></span></div>
      <div id="view-toggle">
        <button id="btn-fpv" class="active">FPV</button>
        <button id="btn-tpv">TPV</button>
        <button id="btn-fx" class="active">FX</button>
      </div>
    </div>

    <!-- Section Jump List -->
    <div id="section-list">
      <div class="section-list-title">SECTIONS</div>
      <!-- Section buttons cleared — add Event space buttons here:
           <button class="section-btn" data-section="KEY">EMOJI Label</button>
           (data-section must match a key in src/sections.js) -->
    </div>

    <!-- Section Info Popup -->
    <div id="section-popup">
      <div id="popup-tag"></div>
      <div id="popup-title"></div>
      <div id="popup-desc"></div>
    </div>

    <!-- Controls Legend -->
    <div id="controls-hint">
      <span>W A S D / Arrows to Move</span>
      <span>Hold Shift to Run</span>
      <span>Click or Drag to Look</span>
      <span>C for Free Look</span>
      <span>V for 1st / 3rd Person</span>
      <span>P or FX to toggle Post FX</span>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div id="loading-inner">
        <div id="loading-logo">EVENT <span>SPACE</span></div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
        <div id="loading-label">Loading scene...</div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
