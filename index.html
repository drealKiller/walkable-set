<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kantanka Funeral Grounds — Walkable Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- HUD: Top Bar -->
    <div id="hud-top">
      <div id="logo">KANTANKA<span>Funeral</span> <span>GROUNDS</span></div>
      <div id="view-toggle">
        <button id="btn-fpv">FPV</button>
        <button id="btn-tpv" class="active">TPV</button>
      </div>
    </div>

    <!-- Section Jump List -->
    <div id="section-list">
      <div class="section-list-title">SECTIONS</div>
      <button class="section-btn" data-section="entrance">🚪 Entrance</button>
      
      <button class="section-btn" data-section="membersTent">⛺ Members Tent</button>
      <button class="section-btn" data-section="specialGuestsNorth">⭐ Special Guests (N)</button>
      <button class="section-btn" data-section="specialGuestsSouth">⭐ Special Guests (S)</button>
      <button class="section-btn" data-section="papasDecor">🌹 Papa's Decor</button>
      <button class="section-btn" data-section="papasThrone">👑 Papa's Throne</button>
    </div>

    <!-- Section Info Popup -->
    <div id="section-popup">
      <div id="popup-tag"></div>
      <div id="popup-title"></div>
      <div id="popup-desc"></div>
    </div>

    <!-- Controls Legend -->
    <div id="controls-hint">
      <span>WASD Move</span>
      <span>Shift Run</span>
      <span>Mouse Look</span>
      <span>Click to lock</span>
      <span>C — Free Look</span>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div id="loading-image-wrap">
        <img id="loading-image" src="/SafoNeverDies.jpg" alt="Apostle Kwadwo Safo Kantanka" />
      </div>
      <div id="loading-inner">
        <div id="loading-logo">KANTANKA<span>Funeral</span> <span>GROUNDS</span></div>
        <div id="loading-subtitle">In Loving Memory of Apostle Kwadwo Safo Kantanka</div>
        <div id="loading-hashtag">#SAFOneverDies</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
        <div id="loading-label">Loading scene...</div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
